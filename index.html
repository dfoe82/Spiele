<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spielebuch">
<meta name="theme-color" content="#1f6f5c">
<title>Spielebuch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f1e8;--card:#fff;--ink:#1d2321;--muted:#6b726f;--line:#e2ddd2;--accent:#1f6f5c;--on:#fff;--accent2:#e6f0ec;--gold:#b7801c;--red:#b8442f;--wood:#e9cf9c;--woodline:#5a3d1c;--stoneW:#fbf8f1;--stoneB:#26221f;--hi:#1f6f5c}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1c2320;--ink:#ecefed;--muted:#9aa39f;--line:#2d3632;--accent:#4fb393;--on:#0e221b;--accent2:#22352e;--gold:#e0b050;--red:#e47c66;--wood:#6e5130;--woodline:#e8d3ad;--stoneW:#f3eee4;--stoneB:#141210;--hi:#6fd3ad}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 15px;background:var(--accent2);color:var(--ink);cursor:pointer;display:inline-block;text-align:center}
button.primary{background:var(--accent);color:var(--on);font-weight:600}
button.danger{color:var(--red)}
button.ghost{background:transparent;padding:8px 10px}
button.small{font-size:14px;padding:6px 10px}
button:disabled{opacity:.4;cursor:default}
.wide{display:block;width:100%;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px}
.tile .ico{font-size:32px}
.tile b{font-size:17px}
.tile small{color:var(--muted)}
a.online{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--ink);text-decoration:none;text-align:left}
a.online .ico{font-size:30px}
.resume{display:flex;flex-direction:column;gap:10px;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border-radius:999px;padding:8px 14px;background:var(--bg);border:1px solid var(--line)}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.num{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:var(--on);color:var(--accent);font-size:12px;font-weight:700;margin-right:6px}
input[type=text],input[type=number],input:not([type]){font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1}
.add{margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px}
.seg button.on{background:var(--accent);color:var(--on);font-weight:600}
.seg.wrap button{flex:0 0 auto}
.standings{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.standings span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap;font-size:14px}
.standings span.lead{border-color:var(--gold)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.sheet th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:500;z-index:1;padding-left:12px}
.sheet thead th{padding:10px 6px;font-weight:700}
.sheet select{appearance:none;-webkit-appearance:none;font:inherit;width:100%;min-width:56px;text-align:center;text-align-last:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.sheet select.set{background:var(--accent2);font-weight:600;border-color:transparent}
.sheet tr.sum td,.sheet tr.sum th{background:var(--bg);font-weight:600}
.sheet tr.sum th{background:var(--bg)}
.sheet tr.total td,.sheet tr.total th{font-weight:800;font-size:18px;padding:10px 6px;border-bottom:0}
.sheet tr.cur td,.sheet tr.cur th{background:var(--accent2)}
.sheet tr.click{cursor:pointer}
/* Kniffel-Block */
.kblock{background:#fffdf6;border-color:#d9cfb8;color:#1d2321;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kblock .sheet th,.kblock .sheet td{border-bottom:1px solid #e6dcc6;border-right:1px solid #eee5d2}
.kblock .sheet th:first-child{background:#fffdf6;text-align:left;padding:6px 10px;min-width:118px}
.kblock .sheet th:first-child span{display:block;font-weight:600;font-size:15px}
.kblock .sheet th:first-child small{display:block;font-size:11px;color:#8a8170;font-weight:400}
.kblock thead th{background:#c8302a!important;color:#fff;font-size:15px;padding:10px 8px;min-width:64px}
.kblock thead th.kt{font-weight:900;letter-spacing:2px;font-size:16px}
.kblock thead th.nx{background:#9e2520!important}
.kblock tr.sec th{background:#f1e9d6!important;color:#8a5a1c;font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;position:static}
.kblock td.kc{height:44px;min-width:64px;font-size:19px;font-weight:700;cursor:pointer;color:#1e4fae}
.kblock td.kc:empty::after{content:'＋';color:#d6ccb6;font-weight:400;font-size:16px}
.kblock td.kc.x{color:#c8302a}
.kblock td.nx{background:rgba(232,178,58,.12)}
.kblock td.kc:active{background:#f3e6c3}
.kblock tr.sum td,.kblock tr.sum th{background:#f7f1e3!important;font-weight:700}
.kblock tr.sum th small{display:inline;font-size:11px;color:#8a8170;font-weight:400}
.kblock tr.sum td small{color:#8a8170;font-weight:500}
.kblock tr.total td,.kblock tr.total th{background:#fff3c4!important;font-size:20px}
.ksheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.ksheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.ksheet .kh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ksheet .kh b{font-size:20px;display:block}
.ksheet .kh small{color:var(--muted)}
.kgrid{display:grid;gap:8px;margin-bottom:12px}
.kgrid.g5{grid-template-columns:repeat(5,1fr)}
.kgrid.g6{grid-template-columns:repeat(6,1fr)}
.kgrid.g1{grid-template-columns:1fr}
.kv{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:12px}
.kv b{font-size:22px}
.kv small{font-size:11px;color:var(--muted)}
.kgrid.g1 .kv{padding:18px}
.kgrid.g1 .kv b{font-size:30px}
.kv.on{background:var(--accent);color:var(--on)}
.kv.on small{color:var(--on)}
.plus{color:var(--accent);font-weight:700}
.minus{color:var(--red)}
.rk-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.rk-row label{flex:1;display:flex;gap:8px;align-items:center}
.rk-row input[type=radio]{width:22px;height:22px;accent-color:var(--accent)}
.rk-row input[type=number]{max-width:120px}
.hole-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hole-nav b{font-size:22px}
.hole-nav button{font-size:22px;width:52px}
.mg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mg-row .nm{flex:1;display:flex;flex-direction:column}
.mg-row .val{min-width:36px;text-align:center;font-size:24px;font-weight:700}
.step{width:48px;height:48px;font-size:24px;padding:0}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kb{text-align:center;margin:0}
.kb .big{font-size:52px;font-weight:800;line-height:1.1;margin:6px 0}
.pips{margin-bottom:10px;letter-spacing:4px;color:var(--gold)}
.winner{border-color:var(--gold);font-size:18px;text-align:center}
.actions{margin-top:20px}
.entry .eh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entry .eh b{flex:0 0 auto}
.entry .eh small{flex:1}
.rank{margin:8px 0 0;padding-left:22px}
.rank li{padding:3px 0}
.rank li div{display:flex;justify-content:space-between}
.rank li.w{font-weight:700}
.stats th,.stats td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.stats th:first-child,.stats td:first-child{text-align:left}
.empty{text-align:center;color:var(--muted);padding:30px 14px}
/* Dart */
.dt-head{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.dt-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.dt-cards.many{grid-template-columns:repeat(2,minmax(0,1fr))}
.dt-cards>:only-child{grid-column:1/-1}
.dt-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.dt-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.dt-card.win{border-color:var(--gold)}
.dt-top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.dt-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-in{font-size:12px;font-weight:700;color:var(--gold)}
.dt-legs{color:var(--gold);letter-spacing:2px;font-size:13px}
.dt-big{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.dt-big small{font-size:14px;font-weight:600;color:var(--muted)}
.dt-sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dt-sub b{color:var(--ink)}
.dt-last{font-size:12px;color:var(--muted)}
.dt-msg{background:var(--accent2);border-radius:12px;padding:8px 12px;text-align:center;font-weight:600;margin-bottom:8px}
.dt-msg.bad{color:var(--red)}
.dt-co{text-align:center;margin-bottom:8px;color:var(--gold);font-size:15px}
.dt-co b{color:var(--ink)}
.dt-turn{text-align:center;font-weight:700;font-size:17px;margin:4px 0 10px}
.dt-mode{margin-bottom:10px}
.dt-entry{font-size:40px;font-weight:800;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:8px;min-height:62px;font-variant-numeric:tabular-nums}
.dt-entry .muted{font-size:20px;font-weight:500}
.dt-quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px}
.dt-quick button{padding:9px 2px;font-size:15px;font-weight:600}
.dt-quick button.co{background:var(--gold);color:#1d1d1d}
.dt-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.dt-pad button{font-size:24px;font-weight:700;padding:13px 0}
.dt-slots{display:flex;gap:6px;margin-bottom:8px}
.dt-slots span{flex:1;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:8px 2px;color:var(--muted);font-size:14px}
.dt-slots span.f{border-style:solid;border-color:var(--accent);color:var(--ink);font-weight:700;font-size:17px}
.dt-slots span.sum{flex:0 0 56px;border:0;font-weight:800;color:var(--ink);font-size:18px}
.dt-mult{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dt-mult button{font-weight:700}
.dt-mult button.on{background:var(--accent);color:var(--on)}
.dt-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.dt-grid button{padding:13px 0;font-size:19px;font-weight:700}
.dt-grid button.hl{box-shadow:inset 0 0 0 2px var(--accent)}
.dt-grid button.miss{grid-column:span 4;font-size:16px;color:var(--red)}
.dt-ask{text-align:center;display:flex;flex-direction:column;gap:10px}
.dt-ask .seg button{font-size:22px;font-weight:800}
.dt-cr td,.dt-cr th{text-align:center}
.dt-cr .mk{font-size:20px;font-weight:800;color:var(--accent)}
.dt-cr .mk.full{color:var(--ink)}
.dt-cr tr.closed th,.dt-cr tr.closed td{opacity:.4}
.dt-cr th.nx{color:var(--accent)}
/* Mühle */
.mh-board{border-radius:20px;filter:drop-shadow(0 6px 14px rgba(40,20,5,.28));margin-bottom:12px;touch-action:manipulation}
.mh-board svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.mh-board .ln{stroke:var(--woodline);stroke-width:7;fill:none;stroke-linecap:square}
.mh-board .pt{fill:var(--woodline)}
.mh-board .hit{fill:transparent;cursor:pointer}
.mh-board .st{stroke-width:4}
.mh-board .w{fill:var(--stoneW);stroke:#b9ae9a}
.mh-board .b{fill:var(--stoneB);stroke:#000}
.mh-board .sel{stroke:var(--gold);stroke-width:10}
.mh-board .tgt{fill:var(--hi);opacity:.55}
.mh-board .rm{stroke:var(--red);stroke-width:10;stroke-dasharray:14 9}
.mh-board .mill{stroke:var(--gold);stroke-width:7}
.mh-board .last{stroke:var(--hi);stroke-width:8}
.mh-p{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid transparent;background:var(--card)}
.mh-p.on{border-color:var(--accent)}
.mh-p .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.mh-p .nm small{color:var(--muted)}
.mh-dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid #b9ae9a}
.mh-dot.b{background:radial-gradient(circle at 36% 30%,#6b6b70,#1c1c1f 42%,#030303);border-color:#000}
.mh-dot.w{background:radial-gradient(circle at 38% 32%,#fffaf0,#ead2a8 55%,#b48a56);border-color:#9c7a4c}
.mh-hand{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.mh-hand i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid #9c917d}
.mh-hand i.b{background:radial-gradient(circle at 36% 30%,#6b6b70,#1c1c1f 42%,#030303);border-color:#000}
.mh-hand i.w{background:radial-gradient(circle at 38% 32%,#fffaf0,#ead2a8 55%,#b48a56);border-color:#9c7a4c}
.mh-msg{text-align:center;font-weight:600;font-size:17px;margin:10px 0;min-height:24px;text-wrap:balance}
.mh-msg.alert{color:var(--red)}
.mh-tools{display:flex;gap:8px}
.mh-tools button{flex:1}
.mh-rules{display:flex;flex-direction:column;gap:8px}
.mh-rule{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.mh-rule.on{border-color:var(--accent);background:var(--accent2)}
.mh-rule input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.mh-rule span{display:flex;flex-direction:column;gap:2px}
.mh-rule small{color:var(--muted)}
.mh-count{text-align:center;font-size:14px;font-weight:600;color:var(--gold);margin:-4px 0 10px}
.mh-rulenote{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<script>
const GAMES={
  kniffel:{name:'Kniffel',ico:'🎲',desc:'Würfelblock',best:'high',min:1},
  rummikub:{name:'Rummikub',ico:'🔢',desc:'Punkte pro Runde',best:'high',min:2},
  minigolf:{name:'Minigolf',ico:'⛳',desc:'Schläge pro Bahn',best:'low',min:1},
  kubb:{name:'Wikingerschach',ico:'🪵',desc:'Gewonnene Runden',best:'high',min:2},
  muehle:{name:'Mühle',ico:'⚪',desc:'2 Spieler, ein Bildschirm',best:'high',min:2,max:2},
  dart:{name:'Dart',ico:'🎯',desc:'301, 501, Cricket, Rund um die Uhr',best:'high',min:1,max:8}
};
const KEY='spielebuch_v1';
let S=load();
let view={name:'home'};

function load(){
  const d={players:[],history:[],current:null};
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return Object.assign(d,s)}catch(e){}
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speichern nicht möglich (privater Modus?).')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(t){return new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

/* ---------- Kniffel ---------- */
const KN_UP=['Einser','Zweier','Dreier','Vierer','Fünfer','Sechser'].map((l,i)=>({k:'u'+(i+1),l,o:range(0,5).map(x=>x*(i+1))}));
const KN_LO=[
  {k:'p3',l:'Dreierpasch',o:[0,...range(5,30)]},
  {k:'p4',l:'Viererpasch',o:[0,...range(5,30)]},
  {k:'fh',l:'Full House',o:[0,25]},
  {k:'ks',l:'Kleine Straße',o:[0,30]},
  {k:'gs',l:'Große Straße',o:[0,40]},
  {k:'kn',l:'Kniffel',o:[0,50]},
  {k:'ch',l:'Chance',o:[0,...range(5,30)]}
];
function knCalc(s){
  const up=KN_UP.reduce((a,r)=>a+(s[r.k]||0),0),bonus=up>=63?35:0,lo=KN_LO.reduce((a,r)=>a+(s[r.k]||0),0);
  return {up,bonus,lo,total:up+bonus+lo};
}
const KN_HINT={u1:'nur Einser zählen',u2:'nur Zweier zählen',u3:'nur Dreier zählen',u4:'nur Vierer zählen',u5:'nur Fünfer zählen',u6:'nur Sechser zählen',
  p3:'alle Augen zählen',p4:'alle Augen zählen',fh:'25 Punkte',ks:'30 Punkte',gs:'40 Punkte',kn:'50 Punkte',ch:'alle Augen zählen'};
const KN_ALL=[...KN_UP,...KN_LO];
let knPick=null;
function knOpen(p,k){knPick={p,k};render()}
function knClose(){knPick=null;render()}
function knSet(v){const {p,k}=knPick;S.current.data.s[p][k]=v;knPick=null;save();render()}
function knNext(c){
  if(c.players.length<2)return -1;
  const f=c.data.s.map(s=>KN_ALL.filter(r=>s[r.k]!=null).length);
  const m=Math.min(...f);return m>=KN_ALL.length?-1:f.indexOf(m);
}
function knV(c){
  const d=c.data,calc=d.s.map(knCalc),nx=knNext(c);
  const cell=(p,r)=>{const v=d.s[p][r.k];return `<td class="kc${v==null?'':v===0?' x':' f'}${p===nx?' nx':''}" onclick="knOpen(${p},'${r.k}')">${v==null?'':v===0?'—':v}</td>`};
  const row=r=>`<tr><th><span>${r.l}</span><small>${KN_HINT[r.k]}</small></th>${c.players.map((_,p)=>cell(p,r)).join('')}</tr>`;
  const sum=(cls,l,f)=>`<tr class="${cls}"><th><span>${l}</span></th>${calc.map((x,p)=>`<td class="${p===nx?'nx':''}">${f(x)}</td>`).join('')}</tr>`;
  let b=`<thead><tr><th class="kt">KNIFFEL</th>${c.players.map((p,i)=>`<th class="${i===nx?'nx':''}">${i===nx?'▶ ':''}${esc(p)}</th>`).join('')}</tr></thead><tbody>`;
  b+=`<tr class="sec"><th colspan="${c.players.length+1}">Oberer Teil</th></tr>`;

/* ---------- Mühle ---------- */
const MH_P=[];[[0,0,6],[1,1,5],[2,2,4]].forEach(([r,a,b])=>{const m=(a+b)/2;[[a,a],[m,a],[b,a],[b,m],[b,b],[m,b],[a,b],[a,m]].forEach(p=>MH_P.push(p))});
const MH_ADJ=MH_P.map((_,i)=>{const r=Math.floor(i/8),k=i%8,a=[r*8+(k+1)%8,r*8+(k+7)%8];if(k%2){if(r>0)a.push(i-8);if(r<2)a.push(i+8)}return a});
const MH_MILLS=[];for(let r=0;r<3;r++)for(const k of [0,2,4,6])MH_MILLS.push([r*8+k,r*8+k+1,r*8+(k+2)%8]);for(const k of [1,3,5,7])MH_MILLS.push([k,k+8,k+16]);
const MH_RULES={frei:['Beliebig oft','Eine Mühle darf immer wieder geöffnet und geschlossen werden (Standard).'],
  einmal:['Jede Mühle nur einmal','Dieselbe Mühle (gleiche 3 Punkte) bringt jedem Spieler nur einmal im Spiel einen Stein. Gilt nicht mehr, sobald man nur noch 3 Steine hat.'],
  direkt:['Nicht direkt hintereinander','Wer eine Mühle öffnet und sie gleich im nächsten Zug wieder schließt, darf keinen Stein nehmen.'],
  anderer:['Nur mit anderem Stein','Eine wieder geschlossene Mühle zählt nur, wenn ein anderer Stein sie schließt als der, der sie geöffnet hat.']};
const MH_DRAW=10;
function mhNew(fly,millRule,draw10){return {b:Array(24).fill(-1),hand:[9,9],turn:0,sel:-1,remove:false,fly,millRule:millRule||'frei',draw10:draw10!==false,e33:0,prev33:false,over:null,moves:0,last:-1,hist:[],sid:Array(24).fill(-1),nid:0,used:[],lastOpen:[null,null],openedBy:{}}}
function mhFix(d){if(!d.sid){d.sid=d.b.map((x,i)=>x>=0?100+i:-1);d.nid=200;d.used=[];d.lastOpen=[null,null];d.openedBy={};d.millRule=d.millRule||'frei'}}
function mhMillsAt(d,i){const p=d.b[i];return MH_MILLS.map((m,k)=>p>=0&&m.includes(i)&&m.every(j=>d.b[j]===p)?k:-1).filter(k=>k>=0)}
const mhCount=(d,p)=>d.hand[p]+d.b.filter(x=>x===p).length;
const mhOnly3=(d,p)=>d.hand[p]===0&&d.b.filter(x=>x===p).length===3;
const mh33=d=>mhOnly3(d,0)&&mhOnly3(d,1);
const mhInMill=(d,i)=>d.b[i]>=0&&MH_MILLS.some(m=>m.includes(i)&&m.every(j=>d.b[j]===d.b[i]));
function mhRemovable(d,p){const st=d.b.map((x,i)=>x===p?i:-1).filter(i=>i>=0);const free=st.filter(i=>!mhInMill(d,i));return free.length?free:st}
const mhFlying=(d,p)=>d.fly&&d.hand[p]===0&&d.b.filter(x=>x===p).length===3;
function mhTargets(d,from){const p=d.b[from];return mhFlying(d,p)?d.b.map((x,i)=>x<0?i:-1).filter(i=>i>=0):MH_ADJ[from].filter(j=>d.b[j]<0)}
function mhCanMove(d,p){if(d.hand[p]>0)return true;return d.b.some((x,i)=>x===p&&mhTargets(d,i).length)}
function mhNext(d){
  d.turn=1-d.turn;d.sel=-1;d.moves++;
  const p=d.turn;
  if(d.hand[p]===0&&d.b.filter(x=>x===p).length<3)d.over={w:1-p,why:'zu wenige Steine'};
  else if(!mhCanMove(d,p))d.over={w:1-p,why:'eingeklemmt'};
  const is33=mh33(d);
  if(is33&&d.prev33)d.e33=(d.e33||0)+1;else if(!is33)d.e33=0;
  d.prev33=is33;
  if(!d.over&&is33&&d.draw10&&d.e33>=2*MH_DRAW)d.over={w:-1,why:`Remis – ${MH_DRAW} Züge je Spieler bei 3 gegen 3 ohne Mühle`};
}
function mhSnap(d){const {hist,...rest}=d;d.hist.push(JSON.stringify(rest));if(d.hist.length>60)d.hist.shift()}
function mhTap(i){
  const d=S.current.data,p=d.turn;if(d.over)return;mhFix(d);
  if(d.remove){
    if(!mhRemovable(d,1-p).includes(i))return mhFlash('Diesen Stein darfst du nicht nehmen – er steht in einer Mühle.');
    mhSnap(d);d.b[i]=-1;d.remove=false;d.last=-1;mhNext(d);return mhSave();
  }
  if(d.hand[p]>0){
    if(d.b[i]>=0)return;
    mhSnap(d);d.b[i]=p;d.sid[i]=d.nid++;d.hand[p]--;d.last=i;const note=mhAfter(d,i);mhSave();return mhFlash(note);
  }
  if(d.b[i]===p){d.sel=d.sel===i?-1:i;return mhSave(true)}
  if(d.sel>=0&&d.b[i]<0){
    if(!mhTargets(d,d.sel).includes(i))return mhFlash(mhFlying(d,p)?'':'Steine ziehen nur entlang der Linie auf einen freien Nachbarpunkt.');
    mhSnap(d);const from=d.sel,opened=mhMillsAt(d,from);
    d.b[i]=p;d.b[from]=-1;d.sid[i]=d.sid[from];d.sid[from]=-1;d.sel=-1;d.last=i;
    opened.forEach(k=>d.openedBy[p+':'+k]=d.sid[i]);
    const at=d.moves,note=mhAfter(d,i);d.lastOpen[p]={mills:opened,at};mhSave();return mhFlash(note);
  }
  if(d.b[i]===1-p)mhFlash('Das ist ein Stein von '+S.current.players[1-p]+'.');
}
function mhAfter(d,i){
  const p=d.turn,formed=mhMillsAt(d,i),rule=d.millRule||'frei';
  if(!formed.length||!d.b.some(x=>x===1-p)){mhNext(d);return ''}
  const counts=formed.filter(k=>{const key=p+':'+k;
    if(rule==='einmal')return !d.used.includes(key)||mhOnly3(d,p);
    if(rule==='direkt'){const lo=d.lastOpen[p];return !(lo&&lo.at+2===d.moves&&lo.mills.includes(k))}
    if(rule==='anderer')return d.openedBy[key]===undefined||d.openedBy[key]!==d.sid[i];
    return true});
  formed.forEach(k=>{const key=p+':'+k;if(!d.used.includes(key))d.used.push(key);delete d.openedBy[key]});
  if(counts.length){d.remove=true;d.sel=-1;return ''}
  mhNext(d);
  return {einmal:'Diese Mühle wurde schon einmal genutzt – kein Stein.',direkt:'Mühle direkt wieder geschlossen – zählt nicht.',anderer:'Derselbe Stein hat die Mühle wieder geschlossen – zählt nicht.'}[rule]||'';
}
function mhUndo(){const d=S.current.data;if(!d.hist.length)return;const prev=JSON.parse(d.hist.pop());Object.assign(d,prev);mhSave()}
function mhDraw(){if(!confirm('Partie als Remis beenden?'))return;const d=S.current.data;d.over={w:-1,why:'Remis'};mhSave()}
let mhMsg='',mhMsgT=null;
function mhFlash(m){if(!m)return;mhMsg=m;clearTimeout(mhMsgT);mhMsgT=setTimeout(()=>{mhMsg='';render()},2600);render()}
function mhSave(quiet){if(!quiet)mhMsg='';save();render()}
function mhV(c){
  const d=c.data,p=d.turn,cls=['w','b'],X=i=>60+MH_P[i][0]*100,Y=i=>60+MH_P[i][1]*100;
  const rm=d.remove?new Set(mhRemovable(d,1-p)):new Set(),tg=d.sel>=0?new Set(mhTargets(d,d.sel)):new Set();
  const mills=new Set();MH_MILLS.forEach(m=>{if(d.b[m[0]]>=0&&m.every(j=>d.b[j]===d.b[m[0]]))m.forEach(j=>mills.add(j))});
  const pl=i=>{const onB=d.b.filter(x=>x===i).length;
    return `<div class="mh-p${!d.over&&p===i?' on':''}"><span class="mh-dot ${cls[i]}"></span><span class="nm"><b>${esc(c.players[i])}</b><small>${i?'Schwarz':'Weiß'} · ${onB} auf dem Brett${mhFlying(d,i)?' · darf springen':''}</small></span><span class="mh-hand" aria-label="${d.hand[i]} Steine zum Setzen">${('<i class="'+cls[i]+'"></i>').repeat(d.hand[i])}</span></div>`};
  const L=`<rect x="60" y="60" width="600" height="600"/><rect x="160" y="160" width="400" height="400"/><rect x="260" y="260" width="200" height="200"/><path d="M360 60V260M360 460V660M60 360H260M460 360H660"/>`;
  let svg=`<svg viewBox="0 0 720 720" role="img" aria-label="Mühlebrett aus Holz"><defs>
    <filter id="mhGrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="3" seed="7"/><feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.27  0 0 0 0 0.12  0 0 0 0.6 0"/></filter>
    <radialGradient id="mhMaple" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#ead2a8"/><stop offset="1" stop-color="#b48a56"/></radialGradient>
    <radialGradient id="mhEbony" cx="36%" cy="30%" r="74%"><stop offset="0" stop-color="#6b6b70"/><stop offset=".42" stop-color="#1c1c1f"/><stop offset="1" stop-color="#030303"/></radialGradient>
    <filter id="mhSh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1c0d03" flood-opacity=".6"/></filter></defs>
    <rect width="720" height="720" rx="30" fill="#7b4c22"/><rect x="16" y="16" width="688" height="688" rx="18" fill="#c99158"/>
    <rect x="16" y="16" width="688" height="688" rx="18" fill="#000" filter="url(#mhGrain)"/>
    <rect x="16" y="16" width="688" height="688" rx="18" fill="none" stroke="#5e3615" stroke-width="3"/>
    <g fill="none" stroke="#f3d6a3" stroke-opacity=".45" stroke-width="10" transform="translate(0,2.5)">${L}</g>
    <g fill="none" stroke="#4b2a12" stroke-width="8">${L}</g>`;
  MH_MILLS.forEach(m=>{if(d.b[m[0]]>=0&&m.every(j=>d.b[j]===d.b[m[0]]))svg+=`<line x1="${X(m[0])}" y1="${Y(m[0])}" x2="${X(m[2])}" y2="${Y(m[2])}" stroke="#ffd36b" stroke-opacity=".6" stroke-width="30" stroke-linecap="round"/>`});
  MH_P.forEach((_,i)=>{
    const x=X(i),y=Y(i),v=d.b[i];

      if(tg.has(i))svg+=`<circle cx="${x}" cy="${y}" r="30" fill="#3f9b6f" fill-opacity=".35" stroke="#3f9b6f" stroke-width="5" stroke-dasharray="10 7"/>`;
    }else{
      svg+=`<circle cx="${x}" cy="${y}" r="40" fill="url(#${v?'mhEbony':'mhMaple'})" filter="url(#mhSh)"/>`;
      svg+=`<circle cx="${x}" cy="${y}" r="25" fill="none" stroke="${v?'#fff':'#000'}" stroke-opacity="${v?'.13':'.14'}" stroke-width="2.5"/>`;

    }

  });
  svg+='</svg>';
  const nm=c.players[p],other=c.players[1-p];
  let msg=mhMsg,alert=!!mhMsg;
  if(!msg){
    if(d.over)msg=d.over.w<0?(d.over.why&&d.over.why!=='Remis'?d.over.why+'.':'Remis – unentschieden.'):`🏆 ${c.players[d.over.w]} gewinnt (${c.players[1-d.over.w]} ${d.over.why==='eingeklemmt'?'kann nicht mehr ziehen':'hat nur noch 2 Steine'}).`;

}

/* ---------- Dart ---------- */
const DT_INVALID=new Set([179,178,176,175,173,172,169,166,163]);
const DT_CR=[20,19,18,17,16,15,25];
const DT_MODES={'301':'301','501':'501',cricket:'Cricket',atc:'Rund um die Uhr'};
const DT_OUT={double:'Double Out',single:'Single Out',master:'Master Out'};
const dtNum=(x,k=1)=>Number(x).toLocaleString('de-DE',{minimumFractionDigits:k,maximumFractionDigits:k});
const dtAvg=(p,d)=>d?p/d*3:0;
function dtNew(v,pl){
  const mode=v.dmode||'501';
  const st=()=>({pts:0,darts:0,f9p:0,f9d:0,hi:0,n100:0,n140:0,n180:0,hco:0,best:0,legs:0,marks:0,hits:0});
  const d={mode,x01:mode==='301'||mode==='501',start:mode==='301'?301:501,out:v.dout||'double',din:(mode==='301'||mode==='501')&&v.din==='double',legsTo:(mode==='301'||mode==='501')?(v.dlegs||1):1,
    input:v.dinput||'total',names:[...pl],n:pl.length,starter:0,legNo:1,st:pl.map(st),hist:[],mult:1,entry:'',ask:null,over:null};

function dtLeg(d){
  d.rem=Array(d.n).fill(d.start);d.vis=Array(d.n).fill(0);d.legDarts=Array(d.n).fill(0);d.legPts=Array(d.n).fill(0);
  d.marks=Array.from({length:d.n},()=>DT_CR.map(()=>0));d.cpts=Array(d.n).fill(0);d.tgt=Array(d.n).fill(1);
  d.isIn=Array(d.n).fill(!d.din);
  d.last=Array(d.n).fill('');d.turn=d.starter;d.cur=[];d.mult=1;d.entry='';
}
function dtSnap(d){const {hist,...r}=d;d.hist.push(JSON.stringify(r));if(d.hist.length>80)d.hist.shift()}
function dtUndo(){const d=S.current.data;if(!d.hist.length)return;Object.assign(d,JSON.parse(d.hist.pop()));d.entry='';dtMsg='';save();render()}
let dtMsg='',dtMsgT=null,dtMsgBad=false;
function dtFlash(m,bad){dtMsg=m;dtMsgBad=!!bad;clearTimeout(dtMsgT);dtMsgT=setTimeout(()=>{dtMsg='';render()},2800)}
function dtNextP(d){d.turn=(d.turn+1)%d.n;d.cur=[];d.mult=1;d.entry=''}
function dtWinLeg(d,p){
  const s=d.st[p];s.legs++;
  if(s.legs>=d.legsTo){d.over={w:p};d.cur=[];return}
  dtFlash(`Leg ${d.legNo} an ${d.names[p]}!`);d.legNo++;d.starter=(d.starter+1)%d.n;dtLeg(d);
}
function dtCommit(d,score,darts,bust,fin){
  const p=d.turn,s=d.st[p],R=d.rem[p],pts=bust?0:score;
  s.pts+=pts;s.darts+=darts;d.legDarts[p]+=darts;d.legPts[p]+=pts;
  if(d.vis[p]<3){s.f9p+=pts;s.f9d+=darts}
  d.vis[p]++;
  if(!bust){s.hi=Math.max(s.hi,score);if(score>=180)s.n180++;else if(score>=140)s.n140++;else if(score>=100)s.n100++;d.rem[p]=R-score}
  d.last[p]=bust?'Bust':String(score);
  if(fin){s.hco=Math.max(s.hco,R);const ld=d.legDarts[p];s.best=s.best?Math.min(s.best,ld):ld;return dtWinLeg(d,p)}
  if(bust)dtFlash(`${d.names[p]}: überworfen – Bust!`,true);
  dtNextP(d);
}
/* Checkout-Vorschlag */
const DT_FIN=[40,32,36,24,20,16,28,12,8,4,50,38,34,30,26,22,18,14,10,6,2];
const DT_SET=[];for(let n=20;n>=1;n--){DT_SET.push({v:n*3,l:'T'+n,c:2+(20-n)*.001});DT_SET.push({v:n,l:String(n),c:1+(20-n)*.001})}DT_SET.push({v:25,l:'25',c:1.5});
for(let n=20;n>=1;n--)DT_SET.push({v:n*2,l:'D'+n,c:2.5+(20-n)*.001});DT_SET.push({v:50,l:'Bull',c:3});
const dtFinL=v=>v===50?'Bull':'D'+v/2;
const DT_CO={};
function dtCheckout(rem,left){
  const key=rem+'|'+left;if(key in DT_CO)return DT_CO[key];
  let best=null;const fin=DT_FIN.map((v,i)=>({v,l:dtFinL(v),c:i*.05}));
  const tryC=(arr,c)=>{if(!best||arr.length<best.a.length||(arr.length===best.a.length&&c<best.c))best={a:arr,c}};
  if(rem<=170&&rem>1){
    fin.forEach(f=>{if(f.v===rem)tryC([f.l],f.c)});
    if(!best&&left>=2)DT_SET.forEach(a=>fin.forEach(f=>{if(a.v+f.v===rem)tryC([a.l,f.l],a.c+f.c)}));
    if(!best&&left>=3)DT_SET.forEach(a=>DT_SET.forEach(b=>{const r=rem-a.v-b.v;if(r<2)return;const f=fin.find(x=>x.v===r);if(f)tryC([a.l,b.l,f.l],a.c+b.c+f.c)}));
  }
  return DT_CO[key]=best?best.a:null;
}
function dtSubmitTotal(){
  const d=S.current.data;if(d.over||d.ask)return;
  if(d.entry===''){dtFlash('Bitte zuerst die Punkte der Aufnahme eingeben.',true);return render()}
  const v=parseInt(d.entry,10),p=d.turn,R=d.rem[p];
  if(v>180||DT_INVALID.has(v)){dtFlash(`${v} Punkte sind mit 3 Darts nicht möglich.`,true);d.entry='';return render()}
  const nw=R-v;d.entry='';dtSnap(d);
  if(nw<0||(nw===1&&d.out!=='single'))dtCommit(d,v,3,true,false);
  else if(nw===0)d.ask={score:v};
  else{if(d.din&&!d.isIn[p]&&v>0)d.isIn[p]=true;dtCommit(d,v,3,false,false)}
  save();render();
}
function dtAsk(k){const d=S.current.data;if(!d.ask)return;const v=d.ask.score;d.ask=null;dtCommit(d,v,k,false,true);save();render()}
function dtAskCancel(){dtUndo()}
function dtKey(k){
  const d=S.current.data;if(d.over||d.ask)return;
  if(k==='del')d.entry=d.entry.slice(0,-1);

function dtDart(n){
  const d=S.current.data,p=d.turn,s=d.st[p];if(d.over||d.ask)return;
  let m=n===0?0:d.mult;if(n===25&&m===3)m=1;
  let val=n===25?(m===2?50:m?25:0):n*m,dead=false;
  dtSnap(d);
  if(d.x01&&d.isIn&&!d.isIn[p]){if(m===2)d.isIn[p]=true;else if(n>0){val=0;dead=true}}
  d.cur.push({n,m,v:val,dead});d.mult=1;
  if(d.x01){
    const sum=d.cur.reduce((a,x)=>a+x.v,0),nw=d.rem[p]-sum;
    const okFin=d.out==='single'||(d.out==='double'&&m===2)||(d.out==='master'&&m>=2);
    if(nw<0||(nw===1&&d.out!=='single')||(nw===0&&!okFin))dtCommit(d,sum,d.cur.length,true,false);
    else if(nw===0)dtCommit(d,sum,d.cur.length,false,true);
    else if(d.cur.length===3)dtCommit(d,sum,3,false,false);
  }else if(d.mode==='cricket'){
    s.darts++;const ti=DT_CR.indexOf(n);
    if(ti>=0&&m>0){s.marks+=m;for(let k=0;k<m;k++){if(d.marks[p][ti]<3)d.marks[p][ti]++;else if(d.marks.some((mk,q)=>q!==p&&mk[ti]<3))d.cpts[p]+=n}}
    if(d.marks[p].every(x=>x>=3)&&d.cpts[p]>=Math.max(...d.cpts)){s.legs++;d.over={w:p};d.cur=[]}
    else if(d.cur.length===3){d.last[p]=d.cur.map(dtLbl).join(' ');dtNextP(d)}
  }else{
    s.darts++;
    if(m>0&&n===d.tgt[p]){s.hits++;d.tgt[p]=d.tgt[p]===20?25:d.tgt[p]===25?26:d.tgt[p]+1}
    if(d.tgt[p]===26){s.legs++;d.over={w:p};d.cur=[]}
    else if(d.cur.length===3){d.last[p]=d.cur.map(dtLbl).join(' ');dtNextP(d)}
  }
  save();render();
}

function dtStatsV(list){
  const ent=list.filter(e=>e.game==='dart'&&e.dart);if(!ent.length)return '';
  const X={},C={},A={};
  ent.forEach(e=>e.players.forEach((p,i)=>{const s=e.dart.st[i];if(!s)return;const win=e.winners.includes(p)&&e.players.length>1;
    if(e.dart.mode==='301'||e.dart.mode==='501'){const r=X[p]=X[p]||{g:0,w:0,pts:0,darts:0,bavg:0,hi:0,n180:0,hco:0,best:0};
      r.g++;if(win)r.w++;r.pts+=s.avg*s.darts/3;r.darts+=s.darts;r.bavg=Math.max(r.bavg,s.avg);r.hi=Math.max(r.hi,s.hi);r.n180+=s.n180;r.hco=Math.max(r.hco,s.hco);if(s.best)r.best=r.best?Math.min(r.best,s.best):s.best}
    else if(e.dart.mode==='cricket'){const r=C[p]=C[p]||{g:0,w:0,marks:0,darts:0};r.g++;if(win)r.w++;r.marks+=s.mpr*s.darts/3;r.darts+=s.darts}
    else{const r=A[p]=A[p]||{g:0,w:0,best:0};r.g++;if(win)r.w++;if(s.darts&&e.winners.includes(p))r.best=r.best?Math.min(r.best,s.darts):s.darts}}));
  let h='';
  const xr=Object.entries(X).sort((a,b)=>dtAvg(b[1].pts,b[1].darts)-dtAvg(a[1].pts,a[1].darts));
  if(xr.length)h+=`<div class="card"><h2>Dart · 301/501</h2><div class="tbl" style="margin:0;border:0"><table class="stats"><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Ø</th><th>Bester Ø</th><th>Höchste</th><th>180</th><th>Checkout</th><th>Bestes Leg</th></tr>${xr.map(([p,r])=>`<tr><td>${esc(p)}</td><td>${r.g}</td><td>${r.w}</td><td><b>${dtNum(dtAvg(r.pts,r.darts))}</b></td><td>${dtNum(r.bavg)}</td><td>${r.hi}</td><td>${r.n180}</td><td>${r.hco||'–'}</td><td>${r.best||'–'}</td></tr>`).join('')}</table></div></div>`;
  const cr=Object.entries(C);
  if(cr.length)h+=`<div class="card"><h2>Dart · Cricket</h2><table class="stats"><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>MPR</th></tr>${cr.map(([p,r])=>`<tr><td>${esc(p)}</td><td>${r.g}</td><td>${r.w}</td><td>${dtNum(r.darts?r.marks/(r.darts/3):0,2)}</td></tr>`).join('')}</table></div>`;
  const ar=Object.entries(A);
  if(ar.length)h+=`<div class="card"><h2>Dart · Rund um die Uhr</h2><table class="stats"><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Beste Runde</th></tr>${ar.map(([p,r])=>`<tr><td>${esc(p)}</td><td>${r.g}</td><td>${r.w}</td><td>${r.best?r.best+' Darts':'–'}</td></tr>`).join('')}</table></div>`;
  return h;
}

/* ---------- Allgemein ---------- */
function totals(c){
  const d=c.data;
  switch(c.game){
    case 'kniffel':return d.s.map(s=>knCalc(s).total);
    case 'rummikub':return c.players.map((_,i)=>d.rounds.reduce((a,r)=>a+rkPoints(r)[i],0));
    case 'minigolf':return d.st.map(a=>a.reduce((x,y)=>x+(y||0),0));
    case 'kubb':return c.players.map((_,i)=>d.rounds.filter(r=>r===i).length);
    case 'muehle':return d.over?[0,1].map(i=>d.over.w===i?1:0):[0,1].map(i=>mhCount(d,i));
    case 'dart':return d.x01?d.st.map(s=>s.legs):d.mode==='cricket'?(d.over?d.cpts.map((x,i)=>d.over.w===i?Math.max(...d.cpts):x):d.cpts):d.tgt.map(t=>Math.min(t,26)-1);
  }
}
function incomplete(c){
  const d=c.data;
  switch(c.game){
    case 'kniffel':return d.s.some(s=>[...KN_UP,...KN_LO].some(r=>s[r.k]==null))?'Es sind noch nicht alle Felder ausgefüllt.':'';
    case 'rummikub':return d.rounds.length?'':'Es wurde noch keine Runde eingetragen.';
    case 'minigolf':return d.st.some(a=>a.some(v=>v==null))?'Es sind noch nicht alle Bahnen eingetragen.':'';
    case 'kubb':return Math.max(...totals(c))<d.target?'Noch hat niemand die nötigen Runden gewonnen.':'';
    case 'dart':return d.over?'':'Das Spiel ist noch nicht beendet – gespeichert wird der aktuelle Stand.';
    case 'muehle':return d.over?'':'Die Partie ist noch nicht entschieden – gespeichert wird der aktuelle Stand (mehr Steine = vorn).';
  }
}
function info(c){
  const d=c.data;
  return {kniffel:'',rummikub:`${d.rounds?.length} Runde${d.rounds?.length===1?'':'n'}`,minigolf:`${d.holes} Bahnen`,kubb:`auf ${d.target} Siege`,dart:`${DT_MODES[d.mode]}${d.x01?`${d.din?' · Double In':''} · ${DT_OUT[d.out]}${d.legsTo>1?` · First to ${d.legsTo}`:''}`:''}`,muehle:d.over?(d.over.w<0?'Remis':`${d.over.why}, ${d.moves} Züge`):`${d.moves} Züge`}[c.game];

  const e=document.getElementById('np'),p=e.value.trim();
  if(!p)return;
  if(!S.players.includes(p)){S.players.push(p);save()}
  if(!view.sel.includes(p))view.sel.push(p);
  render();document.getElementById('np').focus();
}
function delPlayer(i){
  const p=S.players[i];
  if(!confirm(`„${p}“ aus der Namensliste entfernen? (Die Historie bleibt erhalten.)`))return;
  S.players.splice(i,1);view.sel=view.sel.filter(x=>x!==p);save();render();
}
function startGame(){
  const v=view,pl=[...v.sel];
  if(S.current&&!confirm('Es läuft noch ein anderes Spiel. Soll es verworfen werden?'))return;
  const data={
    kniffel:()=>({s:pl.map(()=>({}))}),
    rummikub:()=>({rounds:[]}),
    minigolf:()=>({holes:v.holes,cur:0,st:pl.map(()=>Array(v.holes).fill(null))}),
    kubb:()=>({target:v.target,rounds:[]}),
    muehle:()=>mhNew(v.fly!==false,v.millRule,v.draw10!==false),
    dart:()=>dtNew(v,pl)
  }[v.game]();
  S.current={game:v.game,players:pl,started:Date.now(),data};
  save();view={name:'play'};render();window.scrollTo(0,0);
}
function discard(){if(confirm('Laufendes Spiel verwerfen? Es wird nicht gespeichert.')){S.current=null;save();go('home')}}
function finishGame(){
  const c=S.current,miss=incomplete(c);
  if(!confirm((miss?miss+'\n\n':'')+'Spiel beenden und in der Historie speichern?'))return;
  const sc=totals(c),best=GAMES[c.game].best==='low'?Math.min(...sc):Math.max(...sc);
  S.history.unshift({id:Date.now(),game:c.game,date:Date.now(),started:c.started,players:c.players,scores:sc,winners:c.game==='dart'&&c.data.over?[c.players[c.data.over.w]]:c.players.filter((_,i)=>sc[i]===best),info:info(c),...(c.game==='dart'?{dart:dtSummary(c)}:{})});
  knPick=null;S.current=null;save();view={name:'history',filter:'all'};render();window.scrollTo(0,0);
}
function delEntry(id){if(confirm('Diesen Eintrag aus der Historie löschen?')){S.history=S.history.filter(e=>e.id!==id);save();render()}}

function exportData(){
  const blob=new Blob([JSON.stringify({players:S.players,history:S.history},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spielebuch-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.history))throw 0;
      if(!confirm(`${d.history.length} Spiele importieren? Vorhandene Einträge bleiben erhalten, doppelte werden übersprungen.`))return;
      const ids=new Set(S.history.map(e=>e.id));
      d.history.forEach(e=>{if(!ids.has(e.id)&&GAMES[e.game])S.history.push(e)});
      S.history.sort((a,b)=>b.date-a.date);
      (d.players||[]).forEach(p=>{if(!S.players.includes(p))S.players.push(p)});
      save();render();
    }catch(e){alert('Die Datei konnte nicht gelesen werden.')}
  };
  r.readAsText(f);inp.value='';
}

/* ---------- Ansichten ---------- */
function homeV(){
  let h='';
  if(S.current){
    const c=S.current,g=GAMES[c.game];
    h+=`<div class="card resume"><div><b>${g.ico} ${g.name} läuft noch</b><br><small class="muted">${c.players.map(esc).join(', ')} · seit ${fmtDate(c.started)}</small></div><div class="row"><button class="primary" onclick="go('play')">Weiterspielen</button><button class="danger" onclick="discard()">Verwerfen</button></div></div>`;
  }
  h+='<div class="grid">'+Object.entries(GAMES).map(([k,g])=>`<button class="tile" onclick="startSetup('${k}')"><span class="ico">${g.ico}</span><b>${g.name}</b><small>${g.desc}</small></button>`).join('')+'</div>';
  h+=`<a href="rummi.html" class="wide online"><span class="ico">🌐</span><span><b>Rummikub online</b><br><small class="muted">1 gegen 1, jeder am eigenen Handy</small></span></a>`;
  h+=`<button class="wide" onclick="view={name:'history',filter:'all'};render()">📜 Historie &amp; Statistik <span class="muted">(${S.history.length})</span></button>`;
  return h;
}
function setupV(){
  const v=view,min=GAMES[v.game].min,kubb=v.game==='kubb';
  let h=`<div class="card"><h2>${kubb?'Wer spielt gegeneinander?':'Wer spielt mit?'}</h2><p class="muted">Antippen zum Auswählen – die Reihenfolge ist die Spielreihenfolge.${kubb?' Statt Namen gehen auch Teams.':''}</p><div class="chips">`;
  h+=S.players.map((p,i)=>{const n=v.sel.indexOf(p);return `<button class="chip${n>=0?' on':''}" onclick="${v.edit?`delPlayer(${i})`:`toggleSel(${i})`}">${n>=0&&!v.edit?`<span class="num">${n+1}</span>`:''}${esc(p)}${v.edit?' ✕':''}</button>`}).join('');
  h+=`</div><div class="row add"><input id="np" type="text" placeholder="${kubb?'Neuer Name oder Team':'Neuer Name'}" enterkeyhint="done" onkeydown="if(event.key==='Enter')addPlayer()"><button onclick="addPlayer()">Hinzufügen</button></div>`;
  if(S.players.length)h+=`<button class="ghost small" style="margin-top:8px" onclick="view.edit=!view.edit;render()">${v.edit?'✓ Fertig':'Namen bearbeiten'}</button>`;
  h+='</div>';
  if(v.game==='minigolf')h+=`<div class="card"><h2>Anzahl Bahnen</h2><div class="seg">${[9,12,18].map(n=>`<button class="${v.holes===n?'on':''}" onclick="view.holes=${n};render()">${n}</button>`).join('')}</div></div>`;
  if(kubb)h+=`<div class="card"><h2>Gewinnsätze</h2><div class="seg">${[1,2,3,4,5].map(n=>`<button class="${v.target===n?'on':''}" onclick="view.target=${n};render()">${n}</button>`).join('')}</div></div>`;
  if(v.game==='dart'){
    const dm=v.dmode||'501',x=dm==='301'||dm==='501',seg=(key,cur,opts)=>`<div class="seg wrap">${opts.map(([k,l])=>`<button class="${String(cur)===String(k)?'on':''}" onclick="view.${key}=${typeof k==='number'?k:`'${k}'`};render()">${l}</button>`).join('')}</div>`;
    h+=`<div class="card"><h2>Spielart</h2>${seg('dmode',dm,Object.entries(DT_MODES))}</div>`;
    if(x){
      h+=`<div class="card"><h2>Check-in</h2>${seg('din',v.din||'single',[['single','Single In'],['double','Double In']])}<p class="muted" style="font-size:13px;margin:8px 0 0">${v.din==='double'?'Punkte zählen erst ab dem ersten Doppel (oder Bull) – das Doppel selbst zählt mit.':'Jeder Treffer zählt von Anfang an.'}</p></div>`;
      h+=`<div class="card"><h2>Check-out</h2>${seg('dout',v.dout||'double',Object.entries(DT_OUT))}<p class="muted" style="font-size:13px;margin:8px 0 0">${{double:'Das letzte Dart muss ein Doppel oder Bull sein.',single:'Beliebiger Treffer auf genau 0.',master:'Das letzte Dart muss ein Doppel, Triple oder Bull sein.'}[v.dout||'double']}</p></div>`;
      h+=`<div class="card"><h2>Legs (First to)</h2>${seg('dlegs',v.dlegs||1,[[1,'1 Leg'],[2,'2'],[3,'3'],[5,'5']])}</div>`;
      h+=`<div class="card"><h2>Eingabe</h2>${seg('dinput',v.dinput||'total',[['total','Aufnahme (Summe)'],['darts','Einzelne Darts']])}<p class="muted" style="font-size:13px;margin:8px 0 0">Lässt sich im Spiel jederzeit umschalten.</p></div>`;
    }else h+=`<p class="muted" style="margin:0 0 12px">${dm==='cricket'?'Zahlen 15–20 und Bull je dreimal treffen. Wer eine Zahl geschlossen hat, sammelt dort Punkte, solange ein Gegner sie noch offen hat.':'Der Reihe nach 1 bis 20 und zum Schluss Bull treffen. Wer zuerst fertig ist, gewinnt.'}</p>`;
  }
  if(v.game==='muehle')h+=`<div class="card"><label class="toggle"><span><b>Springen erlaubt</b><br><small class="muted">Wer nur noch 3 Steine hat, darf auf jeden freien Punkt springen.</small></span><input type="checkbox" id="mhfly" ${v.fly!==false?'checked':''} onchange="view.fly=this.checked"></label></div>`;
  if(v.game==='muehle')h+=`<div class="card"><label class="toggle"><span><b>Remis bei 3 gegen 3</b><br><small class="muted">Haben beide nur noch 3 Steine und fällt nach ${MH_DRAW} Zügen je Spieler keine Mühle, endet das Spiel unentschieden.</small></span><input type="checkbox" id="mhdraw" ${v.draw10!==false?'checked':''} onchange="view.draw10=this.checked"></label></div>`;
  if(v.game==='muehle'){const mr=v.millRule||'frei';h+=`<div class="card"><h2>Wieder geschlossene Mühle</h2><div class="mh-rules">${Object.entries(MH_RULES).map(([k,[t,dsc]])=>`<label class="mh-rule${mr===k?' on':''}"><input type="radio" name="mhrule" id="mhr-${k}" value="${k}"${mr===k?' checked':''} onchange="view.millRule='${k}';render()"><span><b>${t}</b><small>${dsc}</small></span></label>`).join('')}</div></div>`}
  const max=GAMES[v.game].max,ok=v.sel.length>=min&&(!max||v.sel.length<=max);
  h+=`<button class="primary wide"${ok?'':' disabled'} onclick="startGame()">Spiel starten${ok?'':max&&v.sel.length>max?` (genau ${max} Spieler)`:` (mind. ${min} ${kubb?'Teams':'Spieler'})`}</button>`;
  if(v.game==='muehle'&&ok)h+=`<p class="muted" style="text-align:center;margin-top:8px">${esc(v.sel[0])} spielt Weiß und beginnt.</p>`;
  return h;
}
function playV(){
  const c=S.current,g=GAMES[c.game],tot=totals(c);
  const best=g.best==='low'?Math.min(...tot):Math.max(...tot),any=tot.some(v=>v!==0);
  let h=c.game==='muehle'||c.game==='dart'?'':`<div class="standings">${c.players.map((p,i)=>`<span class="${any&&tot[i]===best&&c.players.length>1?'lead':''}">${any&&tot[i]===best&&c.players.length>1?'👑 ':''}${esc(p)} <b>${tot[i]}</b></span>`).join('')}</div>`;
  h+={kniffel:knV,rummikub:rkV,minigolf:mgV,kubb:kbV,muehle:mhV,dart:dtV}[c.game](c);
  h+=`<div class="actions"><button class="primary wide" onclick="finishGame()">Spiel beenden &amp; speichern</button><button class="danger wide" onclick="discard()">Spiel verwerfen</button></div>`;
  return h;
}
function entryV(e){
  const g=GAMES[e.game];
  const order=e.players.map((p,i)=>({p,s:e.scores[i]})).sort((a,b)=>g.best==='low'?a.s-b.s:b.s-a.s);
  return `<div class="card entry"><div class="eh"><b>${g.ico} ${g.name}</b><small class="muted">${fmtDate(e.date)}${e.info?' · '+esc(e.info):''}</small><button class="ghost small danger" onclick="delEntry(${e.id})" aria-label="Löschen">✕</button></div><ol class="rank">${order.map(o=>`<li class="${e.winners.includes(o.p)?'w':''}"><div><span>${e.winners.includes(o.p)?'🏆 ':''}${esc(o.p)}${e.dart&&(e.dart.mode==='301'||e.dart.mode==='501')?` <small class="muted">Ø ${dtNum(e.dart.st[e.players.indexOf(o.p)].avg)}</small>`:''}</span><span>${o.s}</span></div></li>`).join('')}</ol></div>`;
}
function histV(){
  const f=view.filter||'all',list=S.history.filter(e=>f==='all'||e.game===f);
  let h=`<div class="seg wrap" style="margin-bottom:14px">${[['all','Alle'],...Object.entries(GAMES).map(([k,g])=>[k,g.ico+' '+g.name])].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="view.filter='${k}';render()">${l}</button>`).join('')}</div>`;
  if(!list.length)h+='<div class="card empty">Noch keine Spiele gespeichert.</div>';
  else{
    const st={};
    list.forEach(e=>{e.players.forEach(p=>{st[p]=st[p]||{n:0,w:0};st[p].n++});if(e.players.length>1)e.winners.forEach(p=>st[p].w++)});
    const rows=Object.entries(st).sort((a,b)=>b[1].w-a[1].w||a[1].n-b[1].n);
    h+=`<div class="card"><h2>Statistik</h2><table class="stats"><tr><th>Spieler</th><th>Spiele</th><th>Siege</th><th>Quote</th></tr>${rows.map(([p,s])=>`<tr><td>${esc(p)}</td><td>${s.n}</td><td>${s.w}</td><td>${Math.round(s.w/s.n*100)} %</td></tr>`).join('')}</table><p class="muted" style="margin:8px 0 0;font-size:13px">Siege zählen nur bei Spielen mit mehreren Teilnehmern.</p></div>`;
    h+=dtStatsV(list);
    h+=list.map(entryV).join('');
  }
  h+=`<div class="card"><h2>Sicherung</h2><p class="muted">Die Daten liegen nur auf diesem Gerät im Browser. Mit einer Sicherung kannst du sie auf ein anderes Gerät übertragen.</p><div class="row"><button onclick="exportData()">⬇︎ Exportieren</button><label class="btn">⬆︎ Importieren<input type="file" accept=".json,application/json" hidden onchange="importData(this)"></label></div></div>`;
  return h;
}

function go(n){knPick=null;view={name:n};render();window.scrollTo(0,0)}
function render(){
  const keep=[...document.querySelectorAll('.tbl')].map(e=>e.scrollLeft);
  let title='Spielebuch',back=false,html='';
  if(view.name==='setup'){title=GAMES[view.game].name;back=true;html=setupV()}
  else if(view.name==='play'){if(!S.current){view={name:'home'};return render()}title=GAMES[S.current.game].ico+' '+GAMES[S.current.game].name;back=true;html=playV()}
  else if(view.name==='history'){title='Historie';back=true;html=histV()}
  else html=homeV();
  document.getElementById('hdr').innerHTML=(back?`<button class="ghost" onclick="go('home')">‹ Start</button>`:'')+`<h1>${esc(title)}</h1>`;
  document.getElementById('app').innerHTML=html;
  document.querySelectorAll('.tbl').forEach((e,i)=>{if(keep[i])e.scrollLeft=keep[i]});
}
render();
</script>
</body>
</html>
